## New window rule

# Ignore maximize requests from apps
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Spotify transparency
windowrule = opacity 0.75 override 0.75 override, match:class spotify

# Vesktop transparency
windowrule = opacity 0.95 override 0.95 override, match:class vesktop

# Nemo transparency
windowrule = opacity 0.65 override 0.65 override, match:class nemo

# xwaylandvideobridge handling
windowrule = opacity 0.0 override 0.0 override, match:class xwaylandvideobridge
windowrule = no_anim on, match:class xwaylandvideobridge
windowrule = no_initial_focus on, match:class xwaylandvideobridge
windowrule = max_size 1 1, match:class xwaylandvideobridge
windowrule = no_blur on, match:class xwaylandvideobridge
windowrule = no_focus on, match:class xwaylandvideobridge

# Send apps to special workspaces
windowrule = workspace special:discord, match:class vesktop
windowrule = workspace special:anki, match:class anki
windowrule = workspace special:emacs, match:class Emacs

# Flameshot overlay
windowrule = move 0 0, match:class flameshot, match:title flameshot
windowrule = pin on, match:class flameshot, match:title flameshot
windowrule = fullscreen on, match:class flameshot, match:title flameshot
windowrule = float on, match:class flameshot, match:title flameshot

exec =  ~/.config/hypr/scripts/autostart.sh
# exec = unset GTK_IM_MODULE

# Iniciar o Waybar
# exec = ~/.config/hypr/scripts/waybar.sh

# Iniciar o Swaybg (Papel de Parede)
# exec = ~/.config/hypr/scripts/swaybg.sh

# Iniciar o Mako (Notificações)
# exec = ~/.config/hypr/scripts/mako.sh
exec-once = fcitx5

# Auto start Once
#
exec-once=nm-applet --indicator
exec-once = flameshot &
exec-once = wl-clip-persist --clipboard regular --no-primary
windowrule = float on, match:class clipse
windowrule = size 622 652, match:class clipse
windowrule = stay_focused on, match:class clipse


