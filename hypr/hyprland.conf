# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=DP-4,2560x1440@180,0x0,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$OpenApps = ~/.config/hypr/scripts/OpenApps
# Set programs that you use
$terminal = wezterm
$fileManager = nemo
$menu = $OpenApps --menu
$Volume = ~/.config/hypr/scripts/Volume
# Definição do tema
# env = RICETHEME,$(cat ~/.config/hypr/.rice)
# env = RICE_DIR,~/.config/hypr/rices/${RICETHEME}

env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
#env = ELECTRON_OZONE_PLATFORM_HINT,x11
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME=qt6ct
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
# exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Incluir configurações do tema

# Correção para aplicações Java
env = _JAVA_AWT_WM_NONREPARENTING,1

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 6

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(7500ffee) rgba(00ff99ee) -45deg
    col.inactive_border = rgba(595959aa)
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

plugin {
    csgo-vulkan-fix {
        res_w = 1024  # Largura desejada
        res_h = 768  # Altura desejada
        class = cs2   # Classe da janela do CS2
        fix_mouse = true
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    shadow {
         enabled = true
	 range = 4
	 render_power = 3
	 color = rgba(1a1a1aee)
    }
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

debug {
  disable_logs = false
}
# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,br
    kb_variant = altgr-intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$shiftMod = SUPER_SHIFT
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod CTRL, Q, killactive,
bind = $mainMod CTRL, M, exit,
bind = $mainMod CTRL, E, exec, $fileManager
bind = $mainMod CTRL, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod CTRL, P, pseudo, # dwindle
bind = $mainMod CTRL, J, togglesplit, # dwindle
bind = $mainMod CTRL, F, exec, hyprctl dispatch fullscreen toggle
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod CTRL, O, exec, ~/.config/hypr/scripts/ocr_clipboard.sh
# Screenshot a window, edit in Satty, and copy to clipboard
bind = $mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot2.sh window

# Screenshot a monitor (fullscreen), edit in Satty, and copy to clipboard
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot2.sh monitor

# Screenshot a region, edit in Satty, and copy to clipboard
bind = $shiftMod, PRINT, exec, ~/.config/hypr/scripts/screenshot2.sh region


# Screenshot a window
#bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
#bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
#bind = $shiftMod, PRINT, exec, hyprshot -m region
# Move focus with mainMod + arrow keys
bind = $mainMod CTRL, h, movefocus, l
bind = $mainMod CTRL, k, movefocus, u
bind = $mainMod CTRL, j, movefocus, d
# dbind = $mainMod, V, exec, ~/.config/hypr/scripts/cliphist-paste.sh
bind = CTRL&$mainMod, H, exec, ~/.config/hypr/scripts/cliphist-paste.sh
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, V, togglespecialworkspace, discord
bind = $mainMod, A, togglespecialworkspace, anki
bind = $mainMod, L, togglespecialworkspace, lunarvim
bind = $mainMod, E, togglespecialworkspace, emacs
bind = $mainMod, O, togglespecialworkspace, okular

bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod SHIFT, V, movetoworkspace, special:discord
bind = $mainMod SHIFT, L, movetoworkspace, special:lunarvim
bind = $mainMod SHIFT, A, movetoworkspace, special:anki
bind = $mainMod SHIFT, E, movetoworkspace, special:emacs
bind = $mainMod SHIFT, O, movetoworkspace, special:okular




# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $Volume --inc 
bindel = ,XF86AudioLowerVolume, exec, $Volume --dec
bindel = ,XF86AudioMute, exec, $Volume --toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = $mainMod, minus, exec, ~/.config/hypr/scripts/brightness.sh down
bind = $mainMod, equal, exec, ~/.config/hypr/scripts/brightness.sh up
bind = $mainMod, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/brightness.sh down
bind = $mainMod, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/brightness.sh up


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

